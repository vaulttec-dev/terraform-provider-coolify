# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like HCP Terraform where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    # Only what consumers actually run: CI runners and developer laptops.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# No `signs`: the fork is not on a registry (see .github/workflows/release.yml).

release:
  # Published, not draft: draft assets need auth, and consumers download the
  # zip with a plain curl.
  draft: false
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  footer: |
    **Full Changelog**: https://github.com/vaulttec-dev/terraform-provider-coolify/compare/{{ .PreviousTag }}...{{ if .IsNightly }}nightly{{ else }}{{ .Tag }}{{ end }}

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^test\\("
      - "^ci:"
      - "^ci\\("
      - "^build:"
      - "^build\\("
      - "^chore\\(deps\\):" # dev tools only
      - "^(docs|chore)\\(git\\):" # repo maintenance nobody cares about
      - "^merge"
      - "^Merge"
      - "\\btypos?\\b" # typos are not interesting
  groups:
    - title: ⚠️ Breaking Changes
      regexp: "^.*\\w[(\\w)]*!:+.*$"
      order: 0
    - title: ✨ New Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: 🔒 Security updates
      # Match any commit that contains [SECURITY] (ie renovate bot)
      regexp: "^.*\\[(?i)SECURITY\\]$"
      order: 150
    - title: 📦 Dependency updates
      regexp: "^.*(feat|fix)\\(deps\\)*:+.*$"
      order: 450
    - title: 🐛 Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: 📝 Documentation updates
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: 🔧 Build process updates
      regexp: "^.*?(build|ci)[(\\w)]*:+.*$"
      order: 500
    - title: 📑 Other changes
      order: 9999
